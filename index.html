<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Китайские карточки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Китайские карточки</h1>

  <!-- Экран выбора колоды -->
  <div id="deck-screen">
    <div id="deck-grid"></div>
  </div>

  <div id="cards-screen" style="display: none;">

    <h2 id="deck-title"></h2>

    <div id="progress-bar-wrap">
      <div id="progress-bar-fill"></div>
    </div>
    <div id="progress-text"></div>

    <div class="scene">
      <div id="card">
        <div class="face face-ru"><span id="word-ru"></span></div>
        <div class="face face-zh"><span id="word-zh"></span></div>
        <div class="face face-py"><span id="word-py"></span></div>
      </div>

      <div id="deck-complete" style="display: none;">
        <div id="deck-complete-title">Колода пройдена! 🎉</div>
        <button id="restartDeckBtn">Повторить заново</button>
      </div>
    </div>

    <div id="answer-buttons">
      <button id="dontKnowBtn" class="ans-btn ans-hard">Не помню</button>
      <button id="hintBtn" class="ans-btn ans-medium">Иероглиф подсказал</button>
      <button id="knowBtn" class="ans-btn ans-easy">Знаю</button>
    </div>

    <div class="bottom-controls">
      <button id="backBtn">← К колодам</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
